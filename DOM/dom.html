<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Form Builder</title>

<style>

body{
    font-family:Arial;
    padding:30px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select{
    width:300px;
    padding:8px;
    margin-top:5px;
}

.radio-group{
    margin-top:5px;
}

.radio-group label{
    display:inline-block;
    margin-right:15px;
    font-weight:normal;
}

.checkbox-group{
    margin-top:10px;
}

button{
    margin-top:20px;
    padding:10px 20px;
    cursor:pointer;
}

</style>

</head>

<body>

<h2>Employee Registration Form</h2>

<form id="myForm"></form>
